# Hardened local wigolo HTTP service (StreamableHTTP + SSE MCP transport).
#
# Unlike the default stdio image command, `serve` exposes an HTTP daemon with a
# /health endpoint, so this compose snippet adds a healthcheck. Use this for
# remote / multi-client MCP setups; for a single local stdio client, prefer the
# plain `docker run -i` line from the README (no compose, no port).
#
# PowerShell (from the repository root):
#   $secretDir = Join-Path $env:LOCALAPPDATA 'wigolo\secrets'
#   New-Item -ItemType Directory -Force $secretDir | Out-Null
#   $env:WIGOLO_API_TOKEN_SECRET_FILE = Join-Path $secretDir 'docker-api-token'
#   $bytes = [byte[]]::new(32)
#   [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
#   [IO.File]::WriteAllText($env:WIGOLO_API_TOKEN_SECRET_FILE,
#     [Convert]::ToHexString($bytes).ToLowerInvariant())
#   # VNC password for the human-solve surface (see the vnc notes below):
#   $env:WIGOLO_VNC_PASSWORD_SECRET_FILE = Join-Path $secretDir 'docker-vnc-password'
#   $vnc = [byte[]]::new(16)
#   [Security.Cryptography.RandomNumberGenerator]::Fill($vnc)
#   [IO.File]::WriteAllText($env:WIGOLO_VNC_PASSWORD_SECRET_FILE,
#     [Convert]::ToHexString($vnc).ToLowerInvariant())
#   docker compose -f packaging/compose.serve.yml up --build
#
# HUMAN-SOLVE / noVNC: this compose builds the `vnc` image target, which runs a
# virtual display the browser draws into and exposes a noVNC web client on
# http://127.0.0.1:6080 (loopback only, password from the secret above). When
# the solve ladder exhausts its automated rungs it prompts on stderr and waits;
# open that URL, solve the challenge in the live browser, and the fetch resumes
# with the harvested clearance. Note that VNC's own password scheme is weak and
# the transport is unencrypted — acceptable strictly because the port never
# leaves host loopback. Do not publish it to a routable interface.
# Set WIGOLO_DOCKER_TARGET=full and WIGOLO_HUMAN_SOLVE=off to drop all of this.
#
# This file builds the CHECKED-OUT SOURCE into the local-only image name
# `wigolo-local:reviewed`; it never pulls or runs an unpinned wigolo image.
# The named volume persists the local cache, on-device models, the browser
# engine binary, and encrypted keys across restarts. Point MCP clients at
# http://127.0.0.1:3333/mcp (StreamableHTTP) or /sse and send the token as a
# Bearer Authorization header.
#
# The daemon also serves a REST API at /v1 (OpenAPI at /openapi.json) — see the
# "REST API & self-host" section of the README.
#
# The process must bind 0.0.0.0 INSIDE its network namespace for Docker port
# forwarding, so wigolo requires authentication. Compose supplies the token as
# a file-mounted secret and refuses to start when WIGOLO_API_TOKEN_SECRET_FILE
# does not identify a host token file. The published HOST port is loopback-only.

services:
  wigolo:
    image: wigolo-local:reviewed
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile
      # `vnc` (not `default`): the anti-bot ladder needs the browser binaries
      # baked in, and the human-solve rung needs a display someone can see. The
      # slim `default` target downloads Playwright chromium on first use and
      # never fetches patchright's separate patched build, so
      # stealthDriver=patchright would silently fall back to the standard driver.
      # Set WIGOLO_DOCKER_TARGET=full to drop the VNC surface but keep the rest.
      target: ${WIGOLO_DOCKER_TARGET:-vnc}
      pull: true
    depends_on:
      searxng:
        condition: service_started
    command: ["serve", "--host", "0.0.0.0", "--port", "3333"]
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${WIGOLO_HOST_PORT:-3333}:3333"
      # noVNC web client. Loopback-published: this grants full mouse/keyboard
      # control of a browser that may hold authenticated sessions, so it must
      # never be bound to a routable interface. Password-gated in the entrypoint.
      - "127.0.0.1:${WIGOLO_NOVNC_HOST_PORT:-6080}:6080"
    volumes:
      - wigolo-data:/data
    tmpfs:
      # Raised from 256m: Xvfb's X socket and the browser's scratch files share
      # this with the existing tmp usage.
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=1000,gid=1000,mode=1777
      # Xvfb compiles its keymap here; the root filesystem stays read-only.
      - /var/lib/xkb:rw,noexec,nosuid,nodev,size=8m,uid=1000,gid=1000,mode=0700
    # Chromium puts renderer shared buffers in /dev/shm; the 64m Docker default
    # (and 256m at MAX_BROWSERS=1) crashes renderers once several browsers run
    # concurrently. Scale with MAX_BROWSERS.
    shm_size: ${WIGOLO_SHM_SIZE:-1gb}
    secrets:
      - wigolo_api_token
      - wigolo_vnc_password
    environment:
      WIGOLO_DATA_DIR: /data
      WIGOLO_PLUGINS_DIR: /app/disabled-plugins
      # Optimized defaults: broad retrieval, learned per-domain TLS hardening,
      # and startup model warmup. Each remains host-overridable.
      WIGOLO_SEARCH: ${WIGOLO_SEARCH:-hybrid}
      WIGOLO_MULTI_QUERY_MAX: ${WIGOLO_MULTI_QUERY_MAX:-5}
      WIGOLO_MULTI_QUERY_CONCURRENCY: ${WIGOLO_MULTI_QUERY_CONCURRENCY:-2}
      WIGOLO_SERVE_MAX_CONCURRENCY: ${WIGOLO_SERVE_MAX_CONCURRENCY:-4}
      WIGOLO_TLS_TIER: ${WIGOLO_TLS_TIER:-auto}
      WIGOLO_EAGER_WARMUP: ${WIGOLO_EAGER_WARMUP:-1}
      # Synthesis provider and credentials are injected only at container
      # creation time. They are never copied into an image layer.
      WIGOLO_LLM_PROVIDER: ${WIGOLO_LLM_PROVIDER:-gemini}
      WIGOLO_LLM_MODEL_GEMINI: ${WIGOLO_LLM_MODEL_GEMINI:-gemini-3.1-flash-lite-preview}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      WIGOLO_GITHUB_TOKEN: ${WIGOLO_GITHUB_TOKEN:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      SEARXNG_URL: http://searxng:8080
      WIGOLO_API_TOKEN_FILE: /run/secrets/wigolo_api_token
      WIGOLO_TELEMETRY: "0"
      WIGOLO_WARM_ENGINES: "0"
      WIGOLO_FETCH_ALLOW_PRIVATE: "0"
      WIGOLO_SERVE_ALLOW_LOCAL_TARGETS: "0"
      WIGOLO_SERVE_ALLOW_UNAUTHENTICATED: "0"
      # Each concurrent Chromium costs roughly 300-500 MB; the stealth path
      # launches a dedicated throwaway browser per fetch rather than reusing a
      # pooled context, so this is the real memory driver. Keep mem_limit below
      # in step with any change here.
      MAX_BROWSERS: ${MAX_BROWSERS:-3}
      # --- Anti-bot solve ladder -----------------------------------------
      # Every value below is QUOTED deliberately: YAML 1.1 coerces bare on/off
      # to true/false, and wigolo normalizes anything that is not the literal
      # string 'on'/'auto' to 'off' — an unquoted `on` would silently DISABLE
      # the knob it looks like it enables.
      #
      # Precedence in config.ts is: explicit knob > hardcore preset > default,
      # and a knob counts as explicit whenever its env var is present. Compose
      # always sets these, so each value here wins outright and the preset is
      # left supplying only the raised 30s challenge-completion floor.
      WIGOLO_HARDCORE: "${WIGOLO_HARDCORE:-on}"
      # Enabled rungs.
      WIGOLO_STEALTH: "${WIGOLO_STEALTH:-on}"
      WIGOLO_STEALTH_DRIVER: "${WIGOLO_STEALTH_DRIVER:-patchright}"
      WIGOLO_HUMANIZE: "${WIGOLO_HUMANIZE:-on}"
      WIGOLO_AUTO_PASS: "${WIGOLO_AUTO_PASS:-on}"
      WIGOLO_CDP_DIRECT: "${WIGOLO_CDP_DIRECT:-auto}"
      WIGOLO_PROXY_BYPASS_ON_CHALLENGE: "${WIGOLO_PROXY_BYPASS_ON_CHALLENGE:-false}"
      # AI-vision captcha solving — OFF by request. Also note the upstream
      # rationale: pointing a vision model at a security control may breach the
      # provider's AUP, so this is the one rung left disabled.
      WIGOLO_AI_SOLVE: "${WIGOLO_AI_SOLVE:-off}"
      # Human-solve: ON, with a real viewable window via the `vnc` target.
      # Open http://127.0.0.1:6080 and solve the challenge in the live browser.
      #
      # Both halves of the gate are required. hasVisibleSurface is derived
      # PURELY from browserHeadful — it does not probe for an actual display —
      # so HEADFUL=true is what makes the rung eligible, and the Xvfb+noVNC
      # stack is what makes that claim true. If you switch the build target back
      # to `full` (no VNC), set WIGOLO_HUMAN_SOLVE=off at the same time or every
      # challenged fetch blocks for the timeout below waiting on nobody.
      WIGOLO_HUMAN_SOLVE: "${WIGOLO_HUMAN_SOLVE:-on}"
      WIGOLO_HUMAN_SOLVE_CONSENT: "${WIGOLO_HUMAN_SOLVE_CONSENT:-true}"
      # Raised from the 120s default: that budget assumes someone already
      # watching a window, not someone opening noVNC after the prompt appears.
      # This is a per-challenge upper bound, not a fixed cost.
      WIGOLO_HUMAN_SOLVE_MS: "${WIGOLO_HUMAN_SOLVE_MS:-300000}"
      # Headful against the Xvfb display, so the window exists and is viewable.
      # WINDOWLESS must stay false here: it is the no-display substitute, and
      # would defeat the point of the VNC surface.
      WIGOLO_BROWSER_HEADFUL: "${WIGOLO_BROWSER_HEADFUL:-true}"
      WIGOLO_BROWSER_WINDOWLESS: "false"
      # Matches the `vnc` target's baked ENV; set explicitly so the value is
      # visible here rather than only in the Dockerfile.
      DISPLAY: ":99"
      WIGOLO_VNC_PASSWORD_FILE: /run/secrets/wigolo_vnc_password
      WIGOLO_VNC_GEOMETRY: "${WIGOLO_VNC_GEOMETRY:-1920x1080x24}"
      # The image runs `playwright install chromium` only — there is no real
      # Chrome binary — so pin the channel rather than paying a failed
      # channel:'chrome' launch probe on the first stealth fetch.
      WIGOLO_BROWSER_CHANNEL: "${WIGOLO_BROWSER_CHANNEL:-chromium}"
      # Optional third-party solver service (Tier-B escape hatch). NOT a URL you
      # visit — it is a credentialed endpoint wigolo posts challenges to. Unset
      # by default; it is credential-bearing, so prefer the keychain over env.
      WIGOLO_SOLVER_URL: "${WIGOLO_SOLVER_URL:-}"
    healthcheck:
      # The daemon serves /health over HTTP; the stdio default command does not,
      # which is why no healthcheck is baked into the image itself.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous grace period: the first request may trigger on-device model
      # and browser-engine downloads into the volume.
      start_period: 120s
    pids_limit: 512
    # Raised from 2g alongside MAX_BROWSERS=3: three concurrent stealth
    # Chromiums plus the on-device embedding/rerank models do not fit in 2g,
    # and the OOM killer lands on the browser mid-fetch rather than failing
    # cleanly. Lower this only if you also lower MAX_BROWSERS.
    mem_limit: ${WIGOLO_MEMORY_LIMIT:-4g}
    cpus: ${WIGOLO_CPU_LIMIT:-2.0}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  searxng:
    # Pinned by digest; reachable only from the private Compose network.
    image: searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812
    pull_policy: if_not_present
    depends_on:
      searxng-init:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    cap_add:
      # The official entrypoint initializes its named volumes as root, then
      # drops to the unprivileged searxng account.
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    volumes:
      - searxng-config:/etc/searxng
      - searxng-cache:/var/cache/searxng
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  searxng-init:
    # Generate a fresh internal secret and enable the JSON format Wigolo uses.
    image: searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812
    pull_policy: if_not_present
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        secret="$$(head -c 32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)"
        printf '%s\n' \
          'use_default_settings: true' \
          'server:' \
          "  secret_key: \"$${secret}\"" \
          '  image_proxy: true' \
          '  limiter: false' \
          'search:' \
          '  formats:' \
          '    - html' \
          '    - json' \
          > /etc/searxng/settings.yml
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    volumes:
      - searxng-config:/etc/searxng
    restart: "no"

volumes:
  wigolo-data:
  searxng-config:
  searxng-cache:

secrets:
  wigolo_api_token:
    # File-backed secrets work on Docker Desktop as well as the Compose plugin.
    # The token is mounted read-only, not placed in the container environment
    # or image. Keep this host file outside the repository and user-readable only.
    file: ${WIGOLO_API_TOKEN_SECRET_FILE:?Set WIGOLO_API_TOKEN_SECRET_FILE to the host token file}
  wigolo_vnc_password:
    # Gates the noVNC surface. Mounted as a file rather than passed through the
    # environment so it never appears in `docker inspect` or the process list.
    # The entrypoint refuses to start if this is missing or empty.
    file: ${WIGOLO_VNC_PASSWORD_SECRET_FILE:?Set WIGOLO_VNC_PASSWORD_SECRET_FILE to the host VNC password file}
